<div class="login-screen">
  <div class="login-card glass">
    <span class="logo material-symbols-rounded">movie</span>
    <h1>Watched!</h1>
    <p class="tagline">Your personal library of movies &amp; series — organized into collections, anywhere you go.</p>

    <button class="google-btn" (click)="login()" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner"></span>
        Signing in…
      } @else {
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.05l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95L3.97 7.28C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      }
    </button>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </div>
</div>
